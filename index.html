<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Video Downloader</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#111;color:#f2f2f2;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
  .card{width:100%;max-width:520px}
  h1{font-size:1.6rem;margin:8px 0 6px}
  p.sub{color:#aaa;margin:0 0 20px;font-size:.95rem}
  input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#1c1c1c;color:#fff;font-size:1rem}
  button,a.btn{display:block;width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;background:#e60023;color:#fff;font-size:1rem;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
  button:disabled{opacity:.6}
  #result{display:none;margin-top:20px;background:#1c1c1c;border-radius:12px;padding:14px}
  #result img{width:100%;border-radius:8px}
  #title{margin:10px 0 0;font-weight:600;word-break:break-word}
  #msg{margin-top:14px;font-size:.95rem;min-height:1.2em}
  .err{color:#ff6b6b}.note{margin-top:28px;font-size:.8rem;color:#888;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h1>TikTok Video Downloader</h1>
  <p class="sub">Paste a public TikTok video link below.</p>
  <input id="url" type="url" placeholder="https://vm.tiktok.com/... or tiktok.com/@user/video/..." autocomplete="off">
  <button id="go">Find Video</button>
  <div id="msg"></div>
  <div id="result">
    <img id="thumb" alt="">
    <div id="title"></div>
    <a id="dl" class="btn" href="#">Download Video</a>
  </div>
  <p class="note">Use responsibly: download only content you own or have permission to save. Private videos are not supported.</p>
</div>
<script>
const $ = id => document.getElementById(id);
$("go").onclick = async () => {
  const url = $("url").value.trim();
  $("msg").className = ""; $("msg").textContent = "";
  $("result").style.display = "none";
  if (!url) { $("msg").className = "err"; $("msg").textContent = "Please paste a link first."; return; }
  $("go").disabled = true; $("go").textContent = "Checking...";
  try {
    const r = await fetch("/api/info", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ url }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Something went wrong.");
    $("title").textContent = d.title;
    if (d.thumbnail) { $("thumb").src = d.thumbnail; $("thumb").style.display = "block"; } else { $("thumb").style.display = "none"; }
    $("dl").href = "/api/download?url=" + encodeURIComponent(url);
    $("result").style.display = "block";
  } catch (e) {
    $("msg").className = "err"; $("msg").textContent = e.message;
  } finally {
    $("go").disabled = false; $("go").textContent = "Find Video";
  }
};
</script>
</body>
</html>
